[package]
name = "zrip-wasm"
version = "0.5.8"
edition = "2024"
description = "WebAssembly bindings for zrip"
repository = "https://github.com/paddor/zrip"
license-file = "../../LICENSE"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
zrip = { path = "../..", default-features = false, features = ["std"] }
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

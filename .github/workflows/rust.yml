name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: cargo test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: [stable, "1.89"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p zrip-core -p zrip-encode -p zrip-decode -p zrip --lib --tests
      - run: cargo test -p zrip-core -p zrip-encode -p zrip-decode -p zrip --lib --tests --features dict_builder
      - run: cargo check -p zrip-core -p zrip-encode -p zrip-decode -p zrip --no-default-features --features alloc
      - run: cargo test -p zrip --no-default-features --features alloc --tests
      - run: cargo test -p zrip --no-default-features --features alloc,simd --tests

  # 32-bit usize: counters and casts that only overflow past 4 GiB.
  i686:
    name: cargo test (i686)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --target i686-unknown-linux-gnu -p zrip-core -p zrip-encode -p zrip-decode -p zrip --lib --tests

  nightly:
    name: nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly test -p zrip-core -p zrip-encode -p zrip-decode -p zrip --lib --tests

  clippy-stable:
    name: clippy (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p zrip-core -p zrip-encode -p zrip-decode -p zrip --lib --tests --features dict_builder

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly fmt --all -- --check
      - run: cargo +nightly clippy -p zrip-core -p zrip-encode -p zrip-decode -p zrip --lib --tests --features dict_builder

  ci-success:
    name: CI success
    needs: [test, i686, nightly, clippy-stable, lint]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: check all jobs passed
        run: |
          if [[ '${{ toJSON(needs.*.result) }}' =~ (failure|cancelled) ]]; then
            exit 1
          fi

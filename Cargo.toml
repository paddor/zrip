[workspace]
members = ["crates/core", "crates/encode", "crates/decode"]
exclude = ["fuzz", "bench", "jsr", "npm"]

[package]
name = "zrip"
version = "0.8.29"
edition = "2024"
rust-version = "1.89"
description = "Fast, memory-safe Rust implementation of Zstandard compression (levels -7..4)"
license = "MIT"
repository = "https://github.com/paddor/zrip"
categories = ["compression"]
keywords = ["zstd", "zstandard", "compression", "decompression"]
# Anchored: a bare `LICENSE` would match `npm/LICENSE` and `jsr/LICENSE` too.
include = ["/src/**/*", "/README.md", "/LICENSE", "/CHANGELOG.md", "/DESIGN.md", "/SAFETY.md", "/SECURITY.md"]

[features]
default = ["std", "frame", "ldm", "simd"]
std = ["alloc", "zrip-core/std", "zrip-encode/std", "zrip-decode/std"]
simd = ["std", "zrip-decode/simd", "zrip-encode/simd"]
alloc = ["zrip-core/alloc", "zrip-encode/alloc", "zrip-decode/alloc"]
frame = ["std", "zrip-encode/frame", "zrip-decode/frame"]
ldm = ["std", "zrip-encode/ldm"]
dict_builder = ["std", "zrip-core/dict_builder"]
nightly = ["zrip-core/nightly", "zrip-encode/nightly", "zrip-decode/nightly"]
# Takes the scalar paths even with `simd`, so no `fearless_simd` code runs
# (it uses `unsafe` inside). zrip's own crates have no `unsafe` in any build.
# Features only add, so this cannot drop the dependency: only
# `default-features = false` without `simd` gives a tree with no `unsafe`.
paranoid = ["zrip-core/paranoid", "zrip-encode/paranoid", "zrip-decode/paranoid"]

[dependencies]
# Exact versions: a sub-crate release that moves to a new zrip-core must never pair with an
# older zrip (0.8.0 to 0.8.23 no longer build since zrip-decode 0.8.20 took zrip-core 0.14).
# release-plz moves the pins with each release.
zrip-core = { version = "=0.14.4", path = "crates/core", default-features = false }
zrip-encode = { version = "=0.10.6", path = "crates/encode", default-features = false }
zrip-decode = { version = "=0.8.22", path = "crates/decode", default-features = false }

[lints]
workspace = true

[dev-dependencies]
# No legacy formats: zrip decodes standard zstd only, and the differential
# tests compare it with C zstd 1.6.0 (zstd-safe 8.4 pulls zstd-sys 2.2).
zstd = { version = "0.14.5", default-features = false, features = ["arrays", "zdict_builder"] }
zstd-safe = { version = "8.4.0", default-features = false, features = ["arrays", "zdict_builder"] }
proptest = "1"
libc = "0.2"


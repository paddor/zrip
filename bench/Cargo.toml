[package]
name = "zrip-bench"
version = "0.0.0"
publish = false
edition = "2024"

[dependencies]
zrip = { path = "..", features = ["dict_builder", "ldm"] }
zstd = "0.14.5"
zstd-safe = "8.4.0"
lz4rip = "0.12.3"
ruzstd = "0.8"
structured-zstd = "0.4.2"
mzstd = "0.2.15"
rusty_zstd = "0.5.0"
libc = "0.2"
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[example]]
name = "zrip_bench"

[[example]]
name = "zrip_ruzstd_compare"
path = "examples/ruzstd_compare.rs"

[[example]]
name = "zrip_bench_streaming_dict"
path = "examples/bench_streaming_dict.rs"

[[example]]
name = "zrip_bench_streaming_steady"
path = "examples/bench_streaming_steady.rs"

[features]
# Builds zrip without its unsafe primitives, for the perf gate's paranoid build.
paranoid = ["zrip/paranoid"]

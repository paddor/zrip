[package]
name = "zrip-encode"
version = "0.8.7"
edition = "2024"
rust-version = "1.89"
description = "zstd encoder for zrip (internal crate)"
license = "MIT"
repository = "https://github.com/paddor/zrip"
readme = "README.md"

[lints]
workspace = true

[features]
default = ["std", "simd"]
std = ["alloc", "zrip-core/std"]
alloc = ["zrip-core/alloc"]
frame = ["std"]
ldm = ["std"]
simd = ["std", "dep:fearless_simd"]
nightly = ["zrip-core/nightly"]
paranoid = ["zrip-core/paranoid"]

[dependencies]
zrip-core = { version = "0.10.1", path = "../core", default-features = false }
fearless_simd = { version = "1.0.0", optional = true }

[dev-dependencies]
zrip = { path = "../.." }

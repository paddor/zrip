[package]
name = "zrip-decode"
version = "0.8.13"
edition = "2024"
rust-version = "1.89"
description = "zstd decoder for zrip (internal crate)"
license = "MIT"
repository = "https://github.com/paddor/zrip"
readme = "README.md"

[lints]
workspace = true

[features]
default = ["std", "simd"]
std = ["alloc", "zrip-core/std"]
alloc = ["zrip-core/alloc"]
simd = ["dep:fearless_simd"]
frame = ["std"]
nightly = ["zrip-core/nightly"]
# No effect today: every build is safe Rust. Kept so existing feature lists
# build, and to keep any future `unsafe` out of builds that enable it.
paranoid = ["zrip-core/paranoid"]

[dependencies]
zrip-core = { version = "0.11.1", path = "../core", default-features = false }
fearless_simd = { version = "1.0.0", optional = true }

[dev-dependencies]
zrip = { path = "../.." }

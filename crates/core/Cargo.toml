[package]
name = "zrip-core"
version = "0.14.5"
edition = "2024"
rust-version = "1.89"
description = "Shared types and codecs for zrip (internal crate)"
license = "MIT"
repository = "https://github.com/paddor/zrip"
readme = "README.md"

[lints]
workspace = true

[features]
default = ["std"]
std = ["alloc"]
alloc = []
dict_builder = ["std"]
nightly = []
# No effect in zrip-core, which has no SIMD paths and no `unsafe`. Kept to
# keep any future `unsafe` out of builds that enable it.
paranoid = []

[dev-dependencies]
zrip = { path = "../.." }
